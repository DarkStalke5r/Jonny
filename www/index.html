<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover">
    <title>Test Cordova App</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .card {
            background: #1e1e1e;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            max-width: 80%;
        }
        .status {
            margin-top: 15px;
            font-weight: bold;
            color: #ff9800;
        }
        .status.ready {
            color: #4caf50;
        }
        button {
            margin-top: 20px;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            background-color: #2196f3;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Cordova Test App</h2>
        <p>Приложение успешно запущено!</p>
        <div id="status" class="status">Инициализация Cordova...</div>
        <button id="btn" onclick="showAlert()">Нажми меня</button>
    </div>

    <!-- Cordova.js подключается автоматически во время сборки -->
    <script src="cordova.js"></script>

    <script>
        document.addEventListener('deviceready', onDeviceReady, false);

        function onDeviceReady() {
            var statusDiv = document.getElementById('status');
            statusDiv.innerText = "Cordova готова!";
            statusDiv.className = "status ready";
            console.log("Cordova initialized successfully.");
        }

        function showAlert() {
            alert("Все работает! APK собран правильно.");
        }
    </script>
</body>
  </html>
